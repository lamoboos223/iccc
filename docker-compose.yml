services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iccc
      POSTGRES_PASSWORD: iccc
      POSTGRES_DB: iccc
    ports:
      - "5432:5432"
    volumes:
      - iccc-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=iccc;Username=iccc;Password=iccc
      Auth__Mode: Development
      Demo__Seed: "true"
      LoadTesting__Worker: "false"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  iccc-data:
